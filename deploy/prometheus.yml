global:
  scrape_interval: 10s

scrape_configs:
  - job_name: redisflow-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  # The compose service name resolves to every worker replica.
  - job_name: redisflow-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8081
