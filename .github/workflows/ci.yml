name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (surefire) + integration tests against real Redis via Testcontainers (failsafe).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/"

      - name: Build Docker images
        run: |
          docker build --build-arg MODULE=api -t redisflow-api:ci .
          docker build --build-arg MODULE=worker -t redisflow-worker:ci .
