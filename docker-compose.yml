# Full stack: Redis + API + 2 workers.      docker compose up --build
# With Prometheus:                          docker compose --profile observability up --build
services:
  redis:
    image: redis:7.4-alpine
    # AOF with fsync every second: on a crash at most ~1s of acknowledged writes can be lost.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      args:
        MODULE: api
    image: redisflow-api:local
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        MODULE: worker
    image: redisflow-worker:local
    environment:
      REDIS_HOST: redis
      # SPRING_MAIL_HOST: smtp.gmail.com      # optional: real email delivery
      # SPRING_MAIL_USERNAME: ${SMTP_USER}
      # SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    # Let in-flight jobs finish on `docker compose stop` (worker shutdown-timeout is 25s).
    stop_grace_period: 30s
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

volumes:
  redis-data:
